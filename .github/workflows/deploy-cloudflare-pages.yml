name: Deploy ProDrome to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --requirement requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m analytics generate-synthetic
      - run: python -m analytics replay --dataset synthetic-lab-network
      - run: python -m analytics evaluate
      - run: pnpm build
      - run: pnpm exec wrangler pages deploy out --project-name=prodrome-f0 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
